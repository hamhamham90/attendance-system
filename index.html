<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อออนไลน์ วิทยาลัยพณิชยการบึงพระพิษณุโลก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-5">
    <div class="container mx-auto bg-white shadow rounded-lg p-5">
        <h1 class="text-2xl font-bold text-center mb-5">ระบบเช็คชื่อนักเรียนออนไลน์<br>สาขาการตลาด วิทยาลัยพณิชยการบึงพระพิษณุโลก</h1>
        <h2 class="text-center mb-3">ครูที่ปรึกษา: ครูแฮม</h2>

        <div class="flex justify-center gap-2 mb-5">
            <button class="bg-blue-500 text-white px-3 py-1 rounded">เช็คชื่อ</button>
            <button class="bg-blue-500 text-white px-3 py-1 rounded">รายละเอียดรายวัน</button>
            <button class="bg-blue-500 text-white px-3 py-1 rounded">สรุปการเข้าเรียน</button>
            <button class="bg-blue-500 text-white px-3 py-1 rounded" onclick="showMonthlySummary()">สรุปรายเดือน</button>
            <button class="bg-blue-500 text-white px-3 py-1 rounded">เปรียบเทียบภาพรวม</button>
        </div>

        <input type="date" id="checkDate" class="block mx-auto mb-5 border rounded px-3 py-1">

        <div class="flex justify-center gap-2 mb-3">
            <button onclick="checkAll('มาโรงเรียน')" class="bg-green-500 text-white px-3 py-1 rounded">มาโรงเรียนทั้งหมด</button>
            <button onclick="checkAll('ไม่มาโรงเรียน')" class="bg-red-500 text-white px-3 py-1 rounded">ไม่มาโรงเรียนทั้งหมด</button>
            <button onclick="checkAll('ลา')" class="bg-yellow-500 text-white px-3 py-1 rounded">ลาทั้งหมด</button>
            <button onclick="clearAll()" class="bg-gray-500 text-white px-3 py-1 rounded">ยกเลิกทั้งหมด</button>
        </div>

        <table class="min-w-full divide-y divide-gray-200 mb-5">
            <thead class="bg-gray-100">
                <tr>
                    <th class="px-6 py-3">รูป 📷</th>
                    <th class="px-6 py-3">รหัสนักเรียน</th>
                    <th class="px-6 py-3">ชื่อ-สกุล</th>
                    <th class="px-6 py-3">สถานะ</th>
                    <th class="px-6 py-3">บันทึกเพิ่มเติม</th>
                </tr>
            </thead>
            <tbody id="studentList" class="divide-y divide-gray-200"></tbody>
        </table>

        <button onclick="saveAttendance()" class="mt-5 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded block mx-auto">บันทึกข้อมูล</button>

        <!-- ส่วนสรุปรายเดือน -->
        <div id="monthlySummary" class="hidden mt-10">
            <h2 class="text-xl font-bold text-center mb-4">สรุปการเข้าเรียนรายเดือน</h2>
            <canvas id="summaryChart" width="400" height="200"></canvas>
        </div>
    </div>

    <script>
        const students = [
            { id: "67202020001", name: "นางสาวจุฑารัตน์ จันทร" },
            { id: "67202020002", name: "นายธันวา ง้วนดิน" },
            { id: "67202020003", name: "นางสาวนันทิตา จงมีสุข" },
            { id: "67202020004", name: "นางสาวบุณยวีร์ มีแสง" },
            { id: "67202020006", name: "นางสาวรติมา เกษมพันธ์" },
            { id: "67202020007", name: "นางสาวรุ่งนภา เที่ยงพร" },
            { id: "67202020039", name: "นางสาวธนภรณ์ พุ่มรส" },
            { id: "67202020040", name: "นายสุทิวัส ก้อนจันทร์" },
            { id: "67202020041", name: "นางสาววิชญาดา จันต๊ะกูล" }
        ];

        const studentList = document.getElementById("studentList");

        students.forEach(student => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td class="px-6 py-2"><input type="file"></td>
                <td class="px-6 py-2">${student.id}</td>
                <td class="px-6 py-2">${student.name}</td>
                <td class="px-6 py-2 space-x-2">
                    <button onclick="setStatus(this, 'มาโรงเรียน')" class="bg-green-200 px-2 py-1 rounded">มาโรงเรียน</button>
                    <button onclick="setStatus(this, 'ไม่มาโรงเรียน')" class="bg-red-200 px-2 py-1 rounded">ไม่มาโรงเรียน</button>
                    <button onclick="setStatus(this, 'ลา')" class="bg-yellow-200 px-2 py-1 rounded">ลา</button>
                </td>
                <td class="px-6 py-2"><input type="text" class="border rounded px-2 py-1"></td>
            `;
            studentList.appendChild(row);
        });

        function setStatus(button, status) {
            const row = button.parentNode.parentNode;
            row.className = '';
            row.classList.add(status === 'มาโรงเรียน' ? 'bg-green-200' : status === 'ไม่มาโรงเรียน' ? 'bg-red-200' : 'bg-yellow-200');
        }

        function checkAll(status) {
            document.querySelectorAll('tbody tr').forEach(row => setStatus(row.querySelector('button'), status));
        }

        function clearAll() {
            document.querySelectorAll('tbody tr').forEach(row => row.className = '');
        }

        function saveAttendance() {
            alert("บันทึกข้อมูลเรียบร้อย");
        }

        function showMonthlySummary() {
            document.getElementById('monthlySummary').classList.remove('hidden');
            const ctx = document.getElementById('summaryChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['มาโรงเรียน', 'ไม่มาโรงเรียน', 'ลา'],
                    datasets: [{
                        label: 'จำนวนวัน',
                        data: [20, 3, 2], // ข้อมูลตัวอย่าง สามารถแก้ไขเป็นค่าจริงได้
                        backgroundColor: ['#4ade80', '#f87171', '#facc15']
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
