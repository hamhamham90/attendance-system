<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อนักเรียนออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>
</head>
<body class="bg-gray-50 p-5">
    <div class="container mx-auto bg-white shadow rounded-lg p-5">
        <h1 class="text-2xl font-bold text-center mb-5">ระบบเช็คชื่อนักเรียนออนไลน์</h1>
        <h2 class="text-center mb-3">ครูที่ปรึกษา: ครูแฮม</h2>

        <div class="flex justify-center gap-2 mb-5">
            <button onclick="showPage('checkInPage')" class="bg-blue-500 text-white px-3 py-1 rounded">เช็คชื่อ</button>
            <button onclick="showPage('dailyDetailPage')" class="bg-blue-500 text-white px-3 py-1 rounded">รายละเอียดรายวัน</button>
            <button onclick="showPage('summaryPage')" class="bg-blue-500 text-white px-3 py-1 rounded">สรุปการเข้าเรียน</button>
            <button onclick="showPage('monthlySummaryPage')" class="bg-blue-500 text-white px-3 py-1 rounded">สรุปรายเดือน</button>
            <button onclick="showPage('comparePage')" class="bg-blue-500 text-white px-3 py-1 rounded">เปรียบเทียบภาพรวม</button>
        </div>

        <!-- หน้าหลัก: เช็คชื่อ -->
        <div id="checkInPage">
            <p class="text-center text-gray-600 mb-4">เลือกวันที่และสถานะการเข้าเรียนของนักเรียน จากนั้นกดปุ่ม "บันทึกข้อมูล" เพื่อบันทึกผล</p>

            <!-- เพิ่มการเลือกวันที่และเวลาปัจจุบัน -->
            <input type="date" id="checkDate" class="block mx-auto mb-5 border rounded px-3 py-1" />
            <input type="time" id="checkTime" class="block mx-auto mb-5 border rounded px-3 py-1" />

            <div class="flex justify-center gap-2 mb-3">
                <button onclick="checkAll('มาโรงเรียน')" class="bg-green-500 text-white px-3 py-1 rounded">มาโรงเรียนทั้งหมด</button>
                <button onclick="checkAll('ไม่มาโรงเรียน')" class="bg-red-500 text-white px-3 py-1 rounded">ไม่มาโรงเรียนทั้งหมด</button>
                <button onclick="checkAll('ลา')" class="bg-yellow-500 text-white px-3 py-1 rounded">ลาทั้งหมด</button>
                <button onclick="clearAll()" class="bg-gray-500 text-white px-3 py-1 rounded">ยกเลิกทั้งหมด</button>
            </div>

            <table class="min-w-full divide-y divide-gray-200 mb-5">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3">รหัสนักเรียน</th>
                        <th class="px-6 py-3">ชื่อ-สกุล</th>
                        <th class="px-6 py-3">สถานะ</th>
                        <th class="px-6 py-3">บันทึกเพิ่มเติม</th>
                    </tr>
                </thead>
                <tbody id="studentList" class="divide-y divide-gray-200">
                    <!-- รายชื่อนักเรียนจะแสดงที่นี่ -->
                </tbody>
            </table>

            <button onclick="saveAttendance()" class="mt-5 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded block mx-auto">บันทึกข้อมูล</button>
        </div>

        <!-- ส่วนอื่นๆ ของหน้า -->
        <!-- รายละเอียดรายวัน, สรุปการเข้าเรียน, สรุปรายเดือน, เปรียบเทียบภาพรวม (เช่นเดียวกับโค้ดเดิม) -->
    </div>

    <script>
        // กำหนดการตั้งค่า Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBDbP11ng3cHktZvKj738qaAmN_j0qUDxI",
            authDomain: "attend1-adb2e.firebaseapp.com",
            databaseURL: "https://attend1-adb2e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "attend1-adb2e",
            storageBucket: "attend1-adb2e.firebasestorage.app",
            messagingSenderId: "799703023848",
            appId: "1:799703023848:web:315bbfccb65fa43d40095d",
            measurementId: "G-NJS1SDWL81"
        };

        // เริ่มต้น Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database(app);

        // รายชื่อนักเรียนที่แสดงในตาราง
        const students = [
            { id: "67202020001", name: "นางสาวจุฑารัตน์ จันทร" },
            { id: "67202020002", name: "นายธันวา ง้วนดิน" },
            { id: "67202020003", name: "นางสาวนันทิตา จงมีสุข" },
            { id: "67202020004", name: "นางสาวบุณยวีร์ มีแสง" },
            { id: "67202020006", name: "นางสาวรติมา เกษมพันธ์" },
            { id: "67202020007", name: "นางสาวรุ่งนภา เที่ยงพร" },
            { id: "67202020039", name: "นางสาวธนภรณ์ พุ่มรส" },
            { id: "67202020040", name: "นายสุทิวัส ก้อนจันทร์" },
            { id: "67202020041", name: "นางสาววิชญาดา จันต๊ะกูล" }
        ];

        // ดึงข้อมูลนักเรียนและแสดงในตาราง
        const studentList = document.getElementById("studentList");

        students.forEach(student => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td class="px-6 py-2">${student.id}</td>
                <td class="px-6 py-2">${student.name}</td>
                <td class="px-6 py-2 space-x-2">
                    <button onclick="setStatus(this, 'มาโรงเรียน')" class="bg-green-200 px-2 py-1 rounded">มาโรงเรียน</button>
                    <button onclick="setStatus(this, 'ไม่มาโรงเรียน')" class="bg-red-200 px-2 py-1 rounded">ไม่มาโรงเรียน</button>
                    <button onclick="setStatus(this, 'ลา')" class="bg-yellow-200 px-2 py-1 rounded">ลา</button>
                </td>
                <td class="px-6 py-2"><input type="text" class="border rounded px-2 py-1"></td>
            `;
            studentList.appendChild(row);
        });

        // เปลี่ยนสถานะของนักเรียน
        function setStatus(button, status) {
            const row = button.parentNode.parentNode;
            row.className = '';
            row.classList.add(status === 'มาโรงเรียน' ? 'bg-green-200' : status === 'ไม่มาโรงเรียน' ? 'bg-red-200' : 'bg-yellow-200');

            // Save status to attendanceData array with the date and time
            const studentId = row.children[0].textContent;
            const studentName = row.children[1].textContent;
            const studentStatus = status;
            const date = document.getElementById("checkDate").value + " " + document.getElementById("checkTime").value; // Get selected date and time
            const studentEntry = { studentId, studentName, studentStatus, date };
            attendanceData.push(studentEntry);
        }

        // ฟังก์ชันบันทึกข้อมูล
        function saveAttendance() {
            alert("บันทึกข้อมูลเรียบร้อย");
            updateSummaryPage();
            // ส่งข้อมูลไปยัง Firebase
            sendDataToFirebase();
        }

        // ส่งข้อมูลไปยัง Firebase Realtime Database
        function sendDataToFirebase() {
            const date = document.getElementById("checkDate").value;
            const time = document.getElementById("checkTime").value;
            const studentId = "67202020001"; // ตัวอย่าง ID ของนักเรียน
            const studentName = "นางสาวจุฑารัตน์ จันทร"; // ตัวอย่างชื่อ
            const note = document.getElementById("note").value || ""; // รับหมายเหตุจากฟอร์ม

            const data = {
                studentId: studentId,
                studentName: studentName,
                status: "มาโรงเรียน", // หรือ "ไม่มาโรงเรียน", "ลา"
                note: note,
                date: date,
                checkInTime: time
            };

            // ส่งข้อมูลไปยัง Firebase Realtime Database
            const newRef = db.ref('attendance').push();
            newRef.set(data)
                .then(() => {
                    alert("บันทึกข้อมูลเรียบร้อย");
                    updateSummaryPage(); // อัพเดทข้อมูลหรือสรุปบางอย่าง
                })
                .catch((error) => {
                    console.error("Error:", error);
                });
        }

        // อัพเดทข้อมูลในหน้า "สรุปการเข้าเรียน"
        function updateSummaryPage() {
            summaryData.innerHTML = '';  // Clear the previous summary data

            attendanceData.forEach(entry => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-2">${entry.studentId}</td>
                    <td class="px-6 py-2">${entry.studentName}</td>
                    <td class="px-6 py-2">${entry.studentStatus === 'มาโรงเรียน' ? 1 : entry.studentStatus === 'ลา' ? 0.5 : 0}</td>
                    <td class="px-6 py-2">-</td>
                    <td class="px-6 py-2">-</td>
                    <td class="px-6 py-2">${entry.studentStatus === 'มาโรงเรียน' ? 1 : entry.studentStatus === 'ลา' ? 0.5 : 0}</td>
                    <td class="px-6 py-2">${(entry.studentStatus === 'มาโรงเรียน' ? 1 : entry.studentStatus === 'ลา' ? 0.5 : 0) * 100}%</td>
                `;
                summaryData.appendChild(row);
            });
        }

        // ฟังก์ชันที่ใช้เปลี่ยนหน้า
        function showPage(pageId) {
            const pages = ['checkInPage', 'dailyDetailPage', 'summaryPage', 'monthlySummaryPage', 'comparePage'];
            pages.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }
    </script>
</body>
</html>
