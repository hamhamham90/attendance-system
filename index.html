<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อออนไลน์ วิทยาลัยพณิชยการบึงพระพิษณุโลก</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-5">
    <div class="container mx-auto bg-white shadow rounded-lg p-5">
        <h1 class="text-2xl font-bold text-center mb-5">ระบบเช็คชื่อนักเรียนออนไลน์<br>สาขาการตลาด วิทยาลัยพณิชยการบึงพระพิษณุโลก</h1>
        <h2 class="text-center mb-3">ครูที่ปรึกษา: ครูแฮม</h2>

        <input type="date" id="checkDate" class="block mx-auto mb-5 border rounded px-3 py-1">

        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-100">
                <tr>
                    <th class="px-6 py-3">รูป</th>
                    <th class="px-6 py-3">รหัสนักเรียน</th>
                    <th class="px-6 py-3">ชื่อ-สกุล</th>
                    <th class="px-6 py-3">สถานะ</th>
                    <th class="px-6 py-3">บันทึกเพิ่มเติม</th>
                </tr>
            </thead>
            <tbody id="studentList" class="divide-y divide-gray-200"></tbody>
        </table>

        <button onclick="saveAttendance()" class="mt-5 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded block mx-auto">บันทึกข้อมูล</button>
    </div>

    <script>
        const students = [
            { id: "67202020001", name: "นางสาวจุฑารัตน์ จันทร" },
            { id: "67202020002", name: "นายธันวา ง้วนดิน" },
            { id: "67202020003", name: "นางสาวนันทิตา จงมีสุข" },
            { id: "67202020004", name: "นางสาวบุณยวีร์ มีแสง" },
            { id: "67202020006", name: "นางสาวรติมา เกษมพันธ์" },
            { id: "67202020007", name: "นางสาวรุ่งนภา เที่ยงพร" },
            { id: "67202020039", name: "นางสาวธนภรณ์ พุ่มรส" },
            { id: "67202020040", name: "นายสุทิวัส ก้อนจันทร์" },
            { id: "67202020041", name: "นางสาววิชญาดา จันต๊ะกูล" }
        ];

        const studentList = document.getElementById("studentList");

        students.forEach(student => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td class="px-6 py-2"><input type="file"></td>
                <td class="px-6 py-2">${student.id}</td>
                <td class="px-6 py-2">${student.name}</td>
                <td class="px-6 py-2">
                    <button onclick="setStatus(this, 'มาเรียน')" class="bg-green-200 px-3 py-1 rounded">มาเรียน</button>
                    <button onclick="setStatus(this, 'ไม่มาเรียน')" class="bg-red-200 px-3 py-1 rounded">ไม่มาเรียน</button>
                    <button onclick="setStatus(this, 'ลา')" class="bg-yellow-200 px-3 py-1 rounded">ลา</button>
                </td>
                <td class="px-6 py-2"><input type="text" class="border rounded px-2 py-1"></td>
            `;

            studentList.appendChild(row);
        });

        function setStatus(button, status) {
            const row = button.parentNode.parentNode;
            row.classList.remove("bg-green-200", "bg-red-200", "bg-yellow-200");

            if (status === "มาเรียน") row.classList.add("bg-green-200");
            else if (status === "ไม่มาเรียน") row.classList.add("bg-red-200");
            else if (status === "ลา") row.classList.add("bg-yellow-200");
        }

        function saveAttendance() {
            alert("บันทึกข้อมูลเรียบร้อย");
            // Logic for saving and percentage calculation can be added here.
        }
    </script>
</body>
</html>
