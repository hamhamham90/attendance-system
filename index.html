<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อการมาเรียนออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white">

    <header class="p-4">
        <h1 class="text-3xl font-bold text-center">ระบบเช็คชื่อการมาเรียนออนไลน์</h1>
        <p class="text-center text-lg">สาขาการตลาด วิทยาลัยพณิชยการบึงพระพิษณุโลก</p>
    </header>

    <div class="container mx-auto mt-10">
        <!-- ฟอร์มเช็คชื่อ -->
        <div class="mb-5">
            <label for="datePicker" class="text-xl">เลือกวันที่:</label>
            <input type="date" id="datePicker" class="bg-white text-black px-4 py-2 rounded-lg" />
            <button onclick="checkAll()" class="bg-green-500 px-4 py-2 rounded-lg ml-4">เช็คชื่อทั้งหมด</button>
            <button onclick="resetAll()" class="bg-red-500 px-4 py-2 rounded-lg ml-4">ยกเลิกทั้งหมด</button>
        </div>

        <table class="w-full table-auto mb-5">
            <thead>
                <tr>
                    <th class="px-4 py-2 text-left">รหัสนักเรียน</th>
                    <th class="px-4 py-2 text-left">ชื่อนักเรียน</th>
                    <th class="px-4 py-2 text-left">สถานะ</th>
                    <th class="px-4 py-2 text-left">อัปโหลดรูปภาพ</th>
                </tr>
            </thead>
            <tbody id="studentList">
                <!-- รายชื่อนักเรียนจะถูกแสดงที่นี่ -->
            </tbody>
        </table>

        <button onclick="saveData()" class="bg-blue-500 px-4 py-2 rounded-lg">บันทึกข้อมูล</button>

        <div id="summary" class="mt-10"></div>
    </div>

    <footer class="text-center py-4 mt-10 text-sm">
        Developer: ครูแฮม<br>
        © 2025-2026 All Rights Reserved
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzFg2hJTT140mwPqsCCePin2Fh0aE7HTYN0XR-66IkRKJgQwIH2snoGS0WZDXHnZnKbxQ/exec";

        let students = [
            { id: "67202020001", name: "นางสาวจุฑารัตน์ จันทร", status: "", image: "" },
            { id: "67202020002", name: "นายธันวา ง้วนดิน", status: "", image: "" },
            { id: "67202020003", name: "นางสาวนันทิตา จงมีสุข", status: "", image: "" },
            { id: "67202020004", name: "นางสาวบุณยวีร์ มีแสง", status: "", image: "" },
            { id: "67202020006", name: "นางสาวรติมา เกษมพันธ์", status: "", image: "" },
            { id: "67202020007", name: "นางสาวรุ่งนภา เที่ยงพร", status: "", image: "" },
            { id: "67202020039", name: "นางสาวธนภรณ์ พุ่มรส", status: "", image: "" },
            { id: "67202020040", name: "นายสุทิวัส ก้อนจันทร์", status: "", image: "" },
            { id: "67202020041", name: "นางสาววิชญาดา จันต๊ะกูล", status: "", image: "" }
        ];

        function saveData() {
            const data = students.map(student => ({
                id: student.id,
                name: student.name,
                status: student.status,
                image: student.image
            }));

            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => alert("บันทึกข้อมูลเรียบร้อย"))
            .catch(error => alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล"));
        }

        function checkAll() {
            students.forEach(student => {
                student.status = "มาโรงเรียน";
            });
            renderStudentList();
        }

        function resetAll() {
            students.forEach(student => {
                student.status = "";
            });
            renderStudentList();
        }

        function renderStudentList() {
            const studentList = document.getElementById("studentList");
            studentList.innerHTML = "";
            students.forEach(student => {
                const row = document.createElement("tr");

                const statusClass = student.status === "มาโรงเรียน" ? "bg-green-500" :
                                    student.status === "ไม่มาโรงเรียน" ? "bg-red-500" : 
                                    student.status === "ลา" ? "bg-yellow-500" : "bg-gray-200";

                row.innerHTML = `
                    <td class="px-4 py-2">${student.id}</td>
                    <td class="px-4 py-2">${student.name}</td>
                    <td class="px-4 py-2">
                        <select onchange="updateStatus(event, '${student.id}')" class="bg-gray-200 rounded-lg">
                            <option value="มาโรงเรียน" class="bg-green-400">มาโรงเรียน</option>
                            <option value="ไม่มาโรงเรียน" class="bg-red-400">ไม่มาโรงเรียน</option>
                            <option value="ลา" class="bg-yellow-400">ลา</option>
                        </select>
                    </td>
                    <td class="px-4 py-2">
                        <input type="file" onchange="uploadImage(event, '${student.id}')" />
                    </td>
                `;
                studentList.appendChild(row);
            });
        }

        function updateStatus(event, studentId) {
            const status = event.target.value;
            const student = students.find(s => s.id === studentId);
            student.status = status;
        }

        function uploadImage(event, studentId) {
            const file = event.target.files[0];
            if (file) {
                const student = students.find(s => s.id === studentId);
                student.image = file.name; // สามารถใช้อัปโหลดลิงก์หรือ URL ของไฟล์ภาพได้
            }
        }

        window.onload = renderStudentList;
    </script>
</body>
</html>
